name: Full release qualification gate

on:
  push:
    tags: ['golden-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-qualification:
    name: Full mandatory-evidence qualification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python v6
        with:
          python-version: '3.11'
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate routes and manifests
        run: python scripts/validate_manifests.py
      - name: Scan full reachable history
        run: python scripts/security_scan.py --history
      - name: Require every mandatory Golden release check
        run: >-
          python scripts/golden.py check --full
          --project examples/python-app
          --out "$RUNNER_TEMP/golden-full-release.json"
