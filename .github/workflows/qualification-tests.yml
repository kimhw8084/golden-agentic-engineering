name: Source qualification tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # actions/setup-python v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Validate routes and manifests
        run: python scripts/validate_manifests.py
      - name: Scan for high-confidence credential patterns
        run: python scripts/security_scan.py
      - name: Run Golden fast checks
        run: python scripts/golden.py check --fast --project examples/python-app
